name: Build Debug APK (Cloud)

# 云端编译 debug 包，本机无需安装 JDK / Android SDK。
# 触发方式：
#   1. 手动：GitHub 仓库 → Actions → 选本工作流 → Run workflow
#   2. 自动：push 到 dev 分支时自动构建
# 构建完成后在 Summary 页面下载 lx-music-debug-apk 产物（装 universal 那个即可）。

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Install JS dependencies
        run: npm ci

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
